version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: ims-postgres
    restart: always
    environment:
      POSTGRES_USER: ims
      POSTGRES_PASSWORD: ims
      POSTGRES_DB: ims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ims-redis
    restart: always
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    container_name: ims-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: ims-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mongo
    environment:
      DATABASE_URL: postgresql://ims:ims@postgres:5432/ims_db
      REDIS_HOST: redis
      MONGO_URL: mongodb://mongo:27017/

volumes:
  postgres_data:
  mongo_data: